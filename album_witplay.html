.slot{position:absolute;border-radius:6px;overflow:hidden;cursor:pointer;transition:box-shadow .2s,background .2s}
.slot:hover,.slot:focus-visible{background:#69efff22;box-shadow:0 0 0 2px #69efff,0 0 18px #69efff;outline:0}
.slot.sp:hover,.slot.sp:focus-visible{background:#fff23322;box-shadow:0 0 0 2px #fff233,0 0 18px #fff233}
.slot img{display:none;width:100%;height:100%;object-fit:cover}
.slot.filled img{display:block}
.slot .x{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;background:#050821cc;color:#fff;font-size:16px;line-height:1;display:none;border:1px solid #fff6}
.slot.filled:hover .x,.slot.filled:focus-within .x{display:block}
@media(hover:none){.slot.filled .x{display:block}}
.hint{text-align:center;color:#b8dfff;font-size:.9rem;margin:12px 0 0}
input[type=file]{display:none}
.bar input[type=text]{flex:1;min-width:200px;padding:10px 14px;border-radius:12px;border:1px solid #55eaff88;background:#fff;color:#101536;font-size:1rem}
.bar label{font-weight:800;color:#bff8ff}
.bar .pdf{background:linear-gradient(135deg,#69efff,#fff36e);color:#06123a;border:0}
.plate{position:absolute;left:33%;width:34%;top:89.3%;height:5%;display:flex;align-items:center;justify-content:center;gap:1.2cqw;background:#050821e6;border:2px solid #21eaff;border-radius:1.2cqw;box-shadow:0 0 12px #21eaff88;font-size:1.7cqw;font-weight:900;white-space:nowrap;overflow:hidden;pointer-events:none}
.plate small{color:#fff233;font-size:1.3cqw;letter-spacing:.1em}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{margin:0!important;padding:0!important;width:297mm;height:210mm;overflow:hidden;background:#030417!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 :root{padding:0!important}
 .app{padding:0!important;max-width:none!important}
 .bar,.hint,.x{display:none!important}
 .album{width:297mm!important;height:210mm!important;aspect-ratio:auto!important;border-radius:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .slot{box-shadow:none!important;background:none!important}
}

<div class="app">
 <div class="bar"><label for="nm">Nome do estudante:</label><input id="nm" type="text" maxlength="40" placeholder="Digite seu nome"><div class="count">Cards colados: <b id="n">0</b>/8</div><button class="pdf" id="pdf" type="button">GERAR PDF / IMPRIMIR</button><button id="clear" type="button">Limpar álbum</button></div>
 <main class="album" id="album"><div class="slot" data-k="0" tabindex="0" role="button" aria-label="Card 01" style="left:30.32%;top:23.89%;width:14.76%;height:27.77%"><img alt="Card 01"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot" data-k="1" tabindex="0" role="button" aria-label="Card 02" style="left:47.62%;top:23.89%;width:14.49%;height:27.77%"><img alt="Card 02"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot" data-k="2" tabindex="0" role="button" aria-label="Card 03" style="left:64.65%;top:23.89%;width:14.62%;height:27.77%"><img alt="Card 03"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot" data-k="3" tabindex="0" role="button" aria-label="Card 04" style="left:81.89%;top:23.89%;width:14.69%;height:27.77%"><img alt="Card 04"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot" data-k="4" tabindex="0" role="button" aria-label="Card 05" style="left:30.32%;top:55.92%;width:14.76%;height:29.10%"><img alt="Card 05"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot" data-k="5" tabindex="0" role="button" aria-label="Card 06" style="left:47.62%;top:55.92%;width:14.49%;height:29.10%"><img alt="Card 06"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot sp" data-k="6" tabindex="0" role="button" aria-label="Card especial 1" style="left:64.65%;top:55.92%;width:14.62%;height:29.10%"><img alt="Card especial 1"><button class="x" type="button" aria-label="Remover">×</button></div><div class="slot sp" data-k="7" tabindex="0" role="button" aria-label="Card especial 2" style="left:81.89%;top:55.92%;width:14.69%;height:29.10%"><img alt="Card especial 2"><button class="x" type="button" aria-label="Remover">×</button></div><div class="plate"><small>ESTUDANTE</small><span id="pn"></span></div></main>

<input type="file" id="file" accept="image/*">
<script>
const KEY="witplay-album-v3",file=document.getElementById("file");let cur=null,store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){store={}}
const slots=[...document.querySelectorAll(".slot")];
function render(){slots.forEach(s=>{const v=store[s.dataset.k],img=s.querySelector("img");img.src=v||"";s.classList.toggle("filled",!!v)});document.getElementById("n").textContent=Object.keys(store).length}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));localStorage.setItem(KEY+"n",nm.value)}catch(e){alert("Não foi possível salvar neste navegador (espaço cheio). O card continua visível nesta sessão.")}}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.9))};im.src=r.result};r.readAsDataURL(f)}
slots.forEach(s=>{
 s.addEventListener("click",e=>{if(e.target.closest(".x"))return;cur=s;file.value="";file.click()});
 s.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();cur=s;file.value="";file.click()}});
 s.querySelector(".x").addEventListener("click",e=>{e.stopPropagation();delete store[s.dataset.k];save();render()});
});
file.addEventListener("change",()=>{const f=file.files[0];if(!f||!cur)return;const t=cur;shrink(f,d=>{store[t.dataset.k]=d;save();render()})});
document.getElementById("clear").onclick=()=>{if(!confirm("Remover todos os cards do álbum?"))return;store={};nm.value="";nome();save();render()};
const nm=document.getElementById("nm"),pn=document.getElementById("pn");
function nome(){pn.textContent=nm.value.trim()||"____________________"}
try{nm.value=localStorage.getItem(KEY+"n")||""}catch(e){}
nm.addEventListener("input",()=>{nome();try{localStorage.setItem(KEY+"n",nm.value)}catch(e){}});
document.getElementById("pdf").onclick=()=>window.print();
nome();render();
</script></body></html>
